services:
  # Node.js API Service
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai_service:8000
      - DATABASE_URL=postgresql://user:password@postgres:5432/deepfake_db
    depends_on:
      - postgres
      - ai_service
    networks:
      - app-network
    volumes:
      - ./apps/api:/app
      - /app/node_modules
    restart: unless-stopped

  # Python AI Service
  ai_service:
    build:
      context: ./apps/ai_service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - WEIGHTS_DIR=/app/weights
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./apps/ai_service/weights:/app/weights
      - ./apps/ai_service/app:/app/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import requests; requests.get('http://localhost:8000/health')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=deepfake_db
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network
    restart: unless-stopped

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - app-network
    restart: unless-stopped
    command: redis-server --appendonly yes

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
